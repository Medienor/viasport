name: Update Live Fixture Events

on:
  schedule:
    # Runs every minute
    - cron: '* * * * *'
  workflow_dispatch: # Allows manual triggering

# Prevent multiple runs from overlapping if one takes > 1 minute
concurrency:
  group: ${{ github.workflow }}-live-events
  cancel-in-progress: true

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your preferred Node.js version
          cache: 'npm' # Or 'yarn'

      - name: Install dependencies
        run: npm ci # Or yarn install --frozen-lockfile

      - name: Run live event update script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} # Make sure this secret exists
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/update-live-fixture-events.js # Run the NEW script